services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jwtapp
      POSTGRES_DB: jwt_learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev-setup.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwtapp -d jwt_learning"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
